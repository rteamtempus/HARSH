<main class="wrap">
  <h1>HARSH</h1>
  <p class="tag">Holly · Ayla · Rory · Stevie · Hazel</p>

  @if (stage() === 'email') {
    <form (submit)="$event.preventDefault(); sendLink()">
      <label>
        Email
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          inputmode="email"
          required
        />
      </label>
      <button type="submit" [disabled]="busy()">
        {{ busy() ? 'Sending…' : 'Send sign-in link' }}
      </button>
    </form>
  } @else {
    <div class="sent">
      <p>Check <strong>{{ email }}</strong> for a sign-in link.</p>
      <p class="hint">The link will sign you in automatically — no code to type. Leave this tab open.</p>
      <button type="button" class="link" (click)="stage.set('email')">Use a different email</button>
    </div>
  }

  @if (error(); as e) { <p class="error">{{ e }}</p> }
</main>
