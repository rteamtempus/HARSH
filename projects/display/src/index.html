<!doctype html>
<html lang="en" data-theme-pack="double-jaded" data-theme="dark" data-mode="wall">
  <head>
    <meta charset="utf-8" />
    <title>HARSH Display</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eff1ed" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iOS add-to-home-screen so the display installs next to other PWAs. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HARSH TV" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- TEMPORARY debug: surface any boot/runtime error on screen (phone/TV has no dev tools). Remove after fix. -->
    <script>
      (function () {
        function show(msg) {
          try {
            var id = 'harsh-boot-error';
            var el = document.getElementById(id);
            if (!el) {
              el = document.createElement('div');
              el.id = id;
              el.style.cssText =
                'position:fixed;inset:0;z-index:100000;background:#fff;color:#a00;font:13px/1.45 monospace;padding:16px;overflow:auto;white-space:pre-wrap;word-break:break-word';
              (document.body || document.documentElement).appendChild(el);
            }
            el.textContent = 'DISPLAY BOOT ERROR:\n\n' + msg;
          } catch (e) {}
        }
        window.addEventListener('error', function (e) {
          show((e.message || 'error') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + ((e.error && e.error.stack) || ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('Unhandled promise rejection:\n' + ((r && (r.stack || r.message)) || String(r)));
        });
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
